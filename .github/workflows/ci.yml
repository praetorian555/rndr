name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    # Pinned, not windows-latest: that label moved to an image carrying Visual Studio 18 2026 and MSVC
    # 14.51, which compiles this differently from the 17.14 and MSVC 14.44 development happens on. This
    # image is the one that matches, and the generator below says so out loud so a future image swap fails
    # here rather than quietly changing compilers again.
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        include:
          - config: Debug
            build-dir: build/ci-debug
          - config: RelWithDebInfo
            build-dir: build/ci-test
          - config: Release
            build-dir: build/ci-release

    env:
      # Turns the [forge] suite's own skip into a failure. Every case in that file steps aside when there is
      # no device, so a runner that lost its driver would come back green having run none of them.
      RNDR_TEST_REQUIRE_VULKAN: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Install Mesa (software OpenGL and Vulkan)
        run: |
          curl -L -o mesa.7z https://github.com/pal1000/mesa-dist-win/releases/download/24.3.2/mesa3d-24.3.2-release-msvc.7z
          7z x mesa.7z -omesa
          cp mesa/x64/opengl32.dll .
          cp mesa/x64/libgallium_wgl.dll .
          cp mesa/x64/libglapi.dll .

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.335.0
          optional_components: com.lunarg.vulkan.vma,com.lunarg.vulkan.volk
          cache: true

      # Through the registry rather than VK_DRIVER_FILES and VK_LAYER_PATH: the loader ignores both of those
      # in an elevated process and a runner is one, so it goes to the registry and finds nothing. This is
      # where mesa's own systemwidedeploy.cmd puts a driver, and where the SDK's installer would have put the
      # layer - the action unpacks the SDK rather than running it, so nothing has registered either.
      - name: Register the software driver and the validation layer
        run: |
          $icd = "$env:GITHUB_WORKSPACE\mesa\x64\lvp_icd.x86_64.json"
          $layer = "$env:VULKAN_SDK\Bin\VkLayer_khronos_validation.json"
          if (-not (Test-Path $icd)) { throw "No lavapipe manifest at $icd." }
          if (-not (Test-Path "$env:GITHUB_WORKSPACE\mesa\x64\vulkan_lvp.dll")) { throw "The lavapipe manifest names a DLL that is not beside it." }
          if (-not (Test-Path $layer)) { throw "No validation layer manifest at $layer." }
          New-Item -Path "HKLM:\SOFTWARE\Khronos\Vulkan\Drivers" -Force | Out-Null
          New-ItemProperty -Path "HKLM:\SOFTWARE\Khronos\Vulkan\Drivers" -Name $icd -Value 0 -PropertyType DWord -Force | Out-Null
          New-Item -Path "HKLM:\SOFTWARE\Khronos\Vulkan\ExplicitLayers" -Force | Out-Null
          New-ItemProperty -Path "HKLM:\SOFTWARE\Khronos\Vulkan\ExplicitLayers" -Name $layer -Value 0 -PropertyType DWord -Force | Out-Null

      # A run with no driver, or with RNDR_FORGE_VALIDATION on and no layer behind it, still passes: the
      # cases skip and every REQUIRE_NO_VALIDATION_ERROR reports nothing. Fail here instead, where the
      # message says which of the two is missing.
      - name: Check the driver and the layer are visible
        run: |
          $summary = & "$env:VULKAN_SDK\Bin\vulkaninfoSDK.exe" --summary 2>&1 | Out-String
          Write-Host $summary
          if ($summary -notmatch 'llvmpipe') { throw "The loader found no lavapipe device: the Vulkan tests would skip themselves." }
          if ($summary -notmatch 'VK_LAYER_KHRONOS_validation') { throw "The loader found no validation layer: the validation assertions would pass on nothing." }

      # Which toolset the pinned image actually carries, so drift from the 14.44 development uses is one
      # line in the log rather than a compile error to be traced back to an image bump.
      - name: Report the compiler
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -products * -property installationPath
          Write-Host "Visual Studio $(& $vswhere -latest -products * -property installationVersion) at $install"
          Write-Host "MSVC toolsets: $((Get-ChildItem "$install\VC\Tools\MSVC" -Name) -join ', ')"

      - name: Configure CMake
        run: >
          cmake -S . -B ${{ matrix.build-dir }}
          -G "Visual Studio 17 2022"
          -DRNDR_BUILD_TESTS=ON
          -DRNDR_BUILD_SAMPLES=OFF
          -DRNDR_HARDENING=OFF
          -DRNDR_FORGE=ON
          -DRNDR_FORGE_VALIDATION=ON

      - name: Build
        run: cmake --build ${{ matrix.build-dir }} --config ${{ matrix.config }} --target rndr-test

      - name: Run tests
        run: ${{ matrix.build-dir }}/${{ matrix.config }}/rndr-test
