name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    # Pinned, not windows-latest: that label moved to an image carrying Visual Studio 18 2026 and MSVC
    # 14.51, which compiles this differently from the 17.14 and MSVC 14.44 development happens on. This
    # image is the one that matches, and the generator below says so out loud so a future image swap fails
    # here rather than quietly changing compilers again.
    runs-on: windows-2022

    # A test binary built without exceptions ends a failure with abort() rather than a report, and abort in a
    # Debug CRT waits on a dialog box nobody is there to click. Without this the job sits on that dialog until
    # the six hour ceiling.
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - config: Debug
            build-dir: build/ci-debug
          - config: RelWithDebInfo
            build-dir: build/ci-test
          - config: Release
            build-dir: build/ci-release

    env:
      # Turns the [forge] suite's own skip into a failure. Every case in that file steps aside when there is
      # no device, so a runner that lost its driver would come back green having run none of them.
      RNDR_TEST_REQUIRE_VULKAN: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Install Mesa (software OpenGL and Vulkan)
        run: |
          curl -L -o mesa.7z https://github.com/pal1000/mesa-dist-win/releases/download/24.3.2/mesa3d-24.3.2-release-msvc.7z
          7z x mesa.7z -omesa
          cp mesa/x64/opengl32.dll .
          cp mesa/x64/libgallium_wgl.dll .
          cp mesa/x64/libglapi.dll .

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.335.0
          optional_components: com.lunarg.vulkan.vma,com.lunarg.vulkan.volk
          # The loader itself, which this image does not carry and the SDK does not ship: the action unpacks
          # the SDK rather than running its installer, and nothing here links vulkan-1.dll anyway - volk
          # loads it by name at run time, so it has to be somewhere the loader search finds it.
          install_runtime: true
          cache: true

      # Through the registry rather than VK_DRIVER_FILES and VK_LAYER_PATH: the loader ignores both of those
      # in an elevated process and a runner is one, so it goes to the registry and finds nothing. This is
      # where mesa's own systemwidedeploy.cmd puts a driver, and where the SDK's installer would have put the
      # layer - the action unpacks the SDK rather than running it, so nothing has registered either.
      # install_runtime only puts the loader in place on the run that downloads the SDK; a cache hit restores
      # the files and the installer never runs, so vulkan-1.dll ends up nowhere the loader search looks. It
      # is in the restored tree either way, so copy it where the installer would have - nothing here links
      # it, volk loads it by name at run time.
      - name: Put the Vulkan loader where it can be found
        run: |
          $found = Get-ChildItem "$env:VULKAN_SDK\runtime" -Recurse -Filter "vulkan-1.dll" -ErrorAction SilentlyContinue
          if (-not $found) { throw "No vulkan-1.dll under $env:VULKAN_SDK\runtime." }
          $loader = @($found | Where-Object { $_.FullName -match '\\x64\\' })[0]
          if (-not $loader) { $loader = $found[0] }
          Write-Host "Loader: $($loader.FullName)"
          Copy-Item $loader.FullName "$env:SystemRoot\System32\vulkan-1.dll" -Force

      - name: Register the software driver and the validation layer
        run: |
          $icd = "$env:GITHUB_WORKSPACE\mesa\x64\lvp_icd.x86_64.json"
          $layer = "$env:VULKAN_SDK\Bin\VkLayer_khronos_validation.json"
          if (-not (Test-Path $icd)) { throw "No lavapipe manifest at $icd." }
          if (-not (Test-Path "$env:GITHUB_WORKSPACE\mesa\x64\vulkan_lvp.dll")) { throw "The lavapipe manifest names a DLL that is not beside it." }
          if (-not (Test-Path $layer)) { throw "No validation layer manifest at $layer." }
          New-Item -Path "HKLM:\SOFTWARE\Khronos\Vulkan\Drivers" -Force | Out-Null
          New-ItemProperty -Path "HKLM:\SOFTWARE\Khronos\Vulkan\Drivers" -Name $icd -Value 0 -PropertyType DWord -Force | Out-Null
          New-Item -Path "HKLM:\SOFTWARE\Khronos\Vulkan\ExplicitLayers" -Force | Out-Null
          New-ItemProperty -Path "HKLM:\SOFTWARE\Khronos\Vulkan\ExplicitLayers" -Name $layer -Value 0 -PropertyType DWord -Force | Out-Null

      # A run with no driver, or with RNDR_FORGE_VALIDATION on and no layer behind it, still passes: the
      # cases skip and every REQUIRE_NO_VALIDATION_ERROR reports nothing. Fail here instead, where the
      # message says which of the two is missing.
      - name: Check the driver and the layer are visible
        run: |
          $summary = & "$env:VULKAN_SDK\Bin\vulkaninfoSDK.exe" --summary 2>&1 | Out-String
          Write-Host $summary
          if ($summary -notmatch 'llvmpipe') { throw "The loader found no lavapipe device: the Vulkan tests would skip themselves." }
          if ($summary -notmatch 'VK_LAYER_KHRONOS_validation') { throw "The loader found no validation layer: the validation assertions would pass on nothing." }

      # Which toolset the pinned image actually carries, so drift from the 14.44 development uses is one
      # line in the log rather than a compile error to be traced back to an image bump.
      - name: Report the compiler
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -products * -property installationPath
          Write-Host "Visual Studio $(& $vswhere -latest -products * -property installationVersion) at $install"
          Write-Host "MSVC toolsets: $((Get-ChildItem "$install\VC\Tools\MSVC" -Name) -join ', ')"

      - name: Configure CMake
        run: >
          cmake -S . -B ${{ matrix.build-dir }}
          -G "Visual Studio 17 2022"
          -DRNDR_BUILD_TESTS=ON
          -DRNDR_BUILD_SAMPLES=OFF
          -DRNDR_HARDENING=OFF
          -DRNDR_FORGE=ON
          -DRNDR_FORGE_VALIDATION=ON

      - name: Build
        run: cmake --build ${{ matrix.build-dir }} --config ${{ matrix.config }} --target rndr-test

      # Everything but Canvas. Its 17 cases fail against Mesa's software opengl32.dll and were what CI was
      # failing on when it was switched off in March; none of them has anything to say about Forge. Canvas is
      # still built, so it still has to compile - only the run is skipped, and dropping the filter is how it
      # comes back.
      - name: Run tests
        run: ${{ matrix.build-dir }}/${{ matrix.config }}/rndr-test "~[canvas]"

  linux:
    # Pinned for the same reason as the Windows image: GCC and Mesa come from this image's archive, and a label
    # that moves would change both under a green build. 24.04 is also what the WSL development build runs.
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        # Both, because GCC only warns about some things with the optimizer on, and warnings are errors. The third is
        # the RNDR_FORGE_VULKAN_1_1 build, which runs the whole suite through the extensions instead of core 1.3.
        include:
          - config: Debug
            build-dir: build/ci-linux-debug
            forge-vulkan-1-1: OFF
          - config: Release
            build-dir: build/ci-linux-release
            forge-vulkan-1-1: OFF
          - config: Debug
            build-dir: build/ci-linux-vulkan-1-1
            forge-vulkan-1-1: ON

    env:
      RNDR_TEST_REQUIRE_VULKAN: "1"

    steps:
      - uses: actions/checkout@v4

      # The XCB and xkbcommon headers the Linux platform layer is written against, lavapipe from the distribution
      # - the loader finds it where apt puts it, so there is nothing to register - and Xvfb, since the window,
      # input and [forge-window] cases need an X server and a runner has none.
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config \
            libxcb1-dev libxcb-randr0-dev libxcb-xfixes0-dev libxcb-xkb-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libvulkan1 mesa-vulkan-drivers vulkan-tools \
            xvfb

      # The validation layer from the SDK rather than apt: 24.04 packages 1.3.275, which predates extensions
      # Forge enables and reports errors against correct code that uses them. This is the SDK the Windows job
      # takes its layer from; the action points VK_LAYER_PATH and LD_LIBRARY_PATH at it.
      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.335.0
          cache: true

      # Same check as on Windows: without a device the Forge cases skip, and without the layer every
      # REQUIRE_NO_VALIDATION_ERROR passes on nothing.
      - name: Check the driver and the layer are visible
        run: |
          summary=$(vulkaninfo --summary 2>&1)
          echo "$summary"
          grep -q llvmpipe <<< "$summary" || { echo "The loader found no lavapipe device: the Vulkan tests would skip themselves."; exit 1; }
          grep -q VK_LAYER_KHRONOS_validation <<< "$summary" || { echo "The loader found no validation layer: the validation assertions would pass on nothing."; exit 1; }

      - name: Report the compiler
        run: |
          gcc --version | head -1
          dpkg-query -W mesa-vulkan-drivers

      # Canvas and audio are not listed: CMakeLists.txt forces both off on Linux.
      - name: Configure CMake
        run: >
          cmake -S . -B ${{ matrix.build-dir }}
          -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          -DRNDR_BUILD_TESTS=ON
          -DRNDR_BUILD_SAMPLES=OFF
          -DRNDR_HARDENING=OFF
          -DRNDR_FORGE=ON
          -DRNDR_FORGE_VALIDATION=ON
          -DRNDR_FORGE_VULKAN_1_1=${{ matrix.forge-vulkan-1-1 }}

      - name: Build
        run: cmake --build ${{ matrix.build-dir }} --target rndr-test

      # -noreset: Xvfb otherwise resets whenever its last client disconnects, which every case closing its
      # application does, and a client connecting during the reset is refused.
      - name: Run tests
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24 -noreset" ${{ matrix.build-dir }}/rndr-test

      # The same suite on a device without dynamic rendering, synchronization2 or timeline semaphores, which the 1.1
      # build records as render passes and original barriers and submits, pacing frames with fences: the SDK's profiles
      # layer hides the three extensions from lavapipe, and the RNDR_TEST_EXPECT_ variables fail the run if it did not. The validation layer Forge enables sits
      # above the one named here, so it checks what is recorded against the device with the extensions hidden.
      - name: Run Forge tests through the fallbacks
        if: matrix.forge-vulkan-1-1 == 'ON'
        env:
          VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_profiles
          VK_KHRONOS_PROFILES_EXCLUDE_DEVICE_EXTENSIONS: VK_KHR_dynamic_rendering,VK_KHR_synchronization2,VK_KHR_timeline_semaphore
          RNDR_TEST_EXPECT_RENDER_PASSES: "1"
          RNDR_TEST_EXPECT_NO_SYNCHRONIZATION2: "1"
          RNDR_TEST_EXPECT_NO_TIMELINE_SEMAPHORES: "1"
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24 -noreset" ${{ matrix.build-dir }}/rndr-test "[forge],[forge-window]"

  linux-clang:
    # Compile only: the GCC jobs already run the suite on this platform, and what Clang adds is its own set of
    # warnings, which are errors here as they are on the other two compilers.
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config clang-18 \
            libxcb1-dev libxcb-randr0-dev libxcb-xfixes0-dev libxcb-xkb-dev libxkbcommon-dev libxkbcommon-x11-dev

      - name: Report the compiler
        run: clang++-18 --version | head -1

      # Samples too, so everything Clang would compile for a user gets compiled here.
      - name: Configure CMake
        run: >
          cmake -S . -B build/ci-linux-clang
          -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang-18
          -DCMAKE_CXX_COMPILER=clang++-18
          -DRNDR_BUILD_TESTS=ON
          -DRNDR_BUILD_SAMPLES=ON
          -DRNDR_HARDENING=OFF
          -DRNDR_FORGE=ON
          -DRNDR_FORGE_VALIDATION=ON

      - name: Build
        run: cmake --build build/ci-linux-clang

  android:
    # Compile only: no runner has a device, and whether the emulator's Vulkan reaches 1.3 is unverified. What this
    # catches is anything that breaks the Android build - the platform branches, and the NDK Clang's warnings, which
    # are errors here as everywhere. Tests and the sample are built too, so the whole Android surface is compiled.
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build

      - name: Report the NDK
        run: grep Pkg.Revision "$ANDROID_NDK_LATEST_HOME/source.properties"

      - name: Configure CMake
        run: >
          cmake -S . -B build/ci-android
          -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake
          -DANDROID_ABI=arm64-v8a
          -DANDROID_PLATFORM=android-29
          -DCMAKE_BUILD_TYPE=Debug
          -DRNDR_BUILD_TESTS=ON
          -DRNDR_BUILD_SAMPLES=ON
          -DRNDR_FORGE=ON
          -DRNDR_FORGE_VALIDATION=ON
          -DRNDR_KTX=OFF

      - name: Build
        run: cmake --build build/ci-android
